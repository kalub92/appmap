# .github/dependabot.yml — 07 §5.1 "a dependency scanner" / 07 §5.5 "Renovate/Dependabot may open
# bump PRs". `npm audit --audit-level=high` in the validate job catches KNOWN advisories at PR time;
# this is the other half: scheduled SCA that opens the bump PR.
#
# Every PR it opens goes through the same gates as any other change (06 R1–R3 + CODEOWNERS, 07 §7):
# nothing here can merge itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/app-map-mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # one PR for the routine patch/minor noise; majors stay individual so they get read
      app-map-mcp-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node ships one release line per Node major, and its npm `latest` tag tracks the
      # current LTS line, not the newest major. A major bump here does not follow the runtime —
      # it describes a DIFFERENT runtime, and the compiler then green-lights calls that do not
      # exist in production: under the 26.x typings `new DatabaseSync(':memory:').setAuthorizer()`
      # compiles clean and throws `TypeError: ... is not a function` on Node 22, and
      # `import { BoundSocket } from 'node:net'` fails at module load. src/store/db.ts imports
      # exactly those modules. Keep this pinned to the major that `engines.node` and the
      # workflow's `node-version` agree on, and lift the ignore only when both move together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - app-map

  # 07 §5.2: a pinned action is only safe if someone is watching for advisories against the pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
